services:
  - type: web
    name: mini-office-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
